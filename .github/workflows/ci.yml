name: Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build

      - name: Upload backend classes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-classes
          path: back/build/classes/java/main
          if-no-files-found: error

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: back/build/reports
          if-no-files-found: warn

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: front/coverage
          if-no-files-found: warn

      - name: Upload frontend distribution
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front/dist
          if-no-files-found: error

  security:
    name: Dependency and filesystem security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Audit production dependencies
        working-directory: front
        run: npm audit --omit=dev --audit-level=critical

      - name: Report all dependency vulnerabilities
        working-directory: front
        continue-on-error: true
        run: npm audit

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: back
        run: chmod +x gradlew

      - name: Resolve Gradle dependencies
        working-directory: back
        run: ./gradlew dependencies

      - name: Fail on committed secrets
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'

      - name: Report filesystem vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn when SonarQube is not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not configured, skipping SonarQube analysis."

      - name: Download backend classes
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: backend-classes
          path: back/build/classes/java/main

      - name: Download frontend coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: front/coverage

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=back/src/main,front/src
            -Dsonar.tests=back/src/test,front/src
            -Dsonar.java.binaries=back/build/classes/java/main
            -Dsonar.javascript.lcov.reportPaths=front/coverage/microcrm/lcov.info

      - name: Check SonarQube Quality Gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
