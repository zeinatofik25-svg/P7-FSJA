services:
  back:
    build:
      context: .
      target: back
    image: orion-microcrm-back:local
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/persons || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  front:
    build:
      context: .
      target: front
    image: orion-microcrm-front:local
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s