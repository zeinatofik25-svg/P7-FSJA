input {
  gelf {
    port => 12201
  }
}

filter {
  json {
    source => "message"
    target => "application_log"
    skip_on_invalid_json => true
  }

  if [application_log] {
    if [application_log][level] {
      mutate { add_field => { "log_level" => "%{[application_log][level]}" } }
    }
    if [application_log][logger_name] {
      mutate { add_field => { "logger_name" => "%{[application_log][logger_name]}" } }
    }
    if [application_log][service] {
      mutate { add_field => { "service_name" => "%{[application_log][service]}" } }
    }
  }

  if ![service_name] {
    if [tag] {
      mutate { add_field => { "service_name" => "%{tag}" } }
    } else {
      mutate { add_field => { "service_name" => "%{container_name}" } }
    }
  }

  # Lignes non JSON : le niveau syslog du driver gelf fait foi (3=err, 4=warn).
  if ![log_level] {
    if [level] and [level] <= 3 {
      mutate { add_field => { "log_level" => "ERROR" } }
    } else if [level] == 4 {
      mutate { add_field => { "log_level" => "WARN" } }
    } else {
      mutate { add_field => { "log_level" => "INFO" } }
    }
  }

  mutate { uppercase => [ "log_level" ] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microcrm-logs-%{+YYYY.MM.dd}"
  }
}